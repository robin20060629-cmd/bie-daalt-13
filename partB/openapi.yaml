openapi: "3.0.3"
info:
  title: Markdown Notes API
  version: "1.0.0"
  description: Markdown тэмдэглэл хөтлөх REST API

servers:
  - url: http://localhost:3001

paths:
  /api/notes:
    get:
      summary: Бүх note жагсаалт
      parameters:
        - in: query
          name: tag
          schema: { type: string }
          description: Tag-аар шүүх
      responses:
        "200":
          description: Note жагсаалт
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }

    post:
      summary: Шинэ note үүсгэх
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                content: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Үүсгэсэн note
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Note" }
        "400":
          description: Validation алдаа

  /api/notes/{id}:
    get:
      summary: Нэг note авах
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Note" }
        "404":
          description: Note олдсонгүй

    put:
      summary: Note засах
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Засварласан note
        "404":
          description: Note олдсонгүй

    delete:
      summary: Note устгах
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Устгасан
        "404":
          description: Note олдсонгүй

  /api/notes/{id}/pdf:
    get:
      summary: Note-г PDF болгон татах
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Note олдсонгүй

  /api/search:
    get:
      summary: Full-text хайлт (SQLite FTS5)
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: Хайх үг
        - in: query
          name: tag
          schema: { type: string }
          description: Tag-аар нэмэлт шүүлт
      responses:
        "200":
          description: Хайлтын үр дүн
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NoteWithSnippet" }
                  count: { type: integer }
                  query: { type: string }
        "400":
          description: q parameter дутуу

components:
  schemas:
    Note:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }

    NoteWithSnippet:
      allOf:
        - $ref: "#/components/schemas/Note"
        - type: object
          properties:
            snippet: { type: string, description: "Хайлтын context snippet (HTML mark tag-тай)" }